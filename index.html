<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Code Contact Card</title>
    <script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: #f0f7ff;
        }
        .card {
            transition: all 0.3s ease;
        }
        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 20px 25px -5px rgb(0 0 0 / 0.1), 0 8px 10px -6px rgb(0 0 0 / 0.1);
        }
        .qr-code {
            image-rendering: pixelated;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">
    <div class="card bg-white rounded-2xl p-8 shadow-lg max-w-md w-full">
        <h1 class="text-3xl font-bold text-center text-gray-800 mb-6">Contact QR Codes</h1>
        
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <!-- WhatsApp QR -->
            <div class="flex flex-col items-center p-4 bg-green-50 rounded-xl">
                <div class="text-green-600 text-2xl mb-3">
                    <i class="bi bi-whatsapp"></i>
                </div>
                <h2 class="text-lg font-semibold text-green-700 mb-3">WhatsApp</h2>
                <div id="whatsapp-qr" class="qr-code bg-white p-2 rounded-lg mb-2"></div>
                <p class="text-sm text-green-600">+16292802851</p>
            </div>

            <!-- SMS QR -->
            <div class="flex flex-col items-center p-4 bg-blue-50 rounded-xl">
                <div class="text-blue-600 text-2xl mb-3">
                    <i class="bi bi-chat-dots"></i>
                </div>
                <h2 class="text-lg font-semibold text-blue-700 mb-3">SMS</h2>
                <div id="sms-qr" class="qr-code bg-white p-2 rounded-lg mb-2"></div>
                <p class="text-sm text-blue-600">+18782870641</p>
            </div>
        </div>

        <div class="mt-6 text-center text-sm text-gray-500">
            Scan to connect instantly!
        </div>
    </div>

    <script>
        function generateQR(elementId, data) {
            const qr = qrcode(0, 'M');
            qr.addData(data);
            qr.make();
            document.getElementById(elementId).innerHTML = qr.createImgTag(6);
        }

        // Generate WhatsApp QR Code
        generateQR('whatsapp-qr', 'https://wa.me/16292802851');

        // Generate SMS QR Code
        generateQR('sms-qr', 'sms:+18782870641');
    </script>
<script>document.body.addEventListener('wheel', e => { if (!e.ctrlKey) return; e.preventDefault(); return }, { passive: false })</script>
	</body>
</html>
